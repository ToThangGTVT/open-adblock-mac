name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The core pins its toolchain in rust-toolchain.toml; install it before cargo runs.
      - name: Rust toolchain
        working-directory: open-adblock-core
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: open-adblock-core

      - name: Build the core (COpenAdBlock.xcframework)
        run: scripts/build-core.sh

      # Unsigned: Network Extensions need a team and provisioning profiles, so this build checks
      # that everything compiles; it cannot activate its system extension.
      - name: Build the app (Release, unsigned)
        run: |
          xcodebuild -version
          xcodebuild -scheme OpenAdBlock -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package
        run: |
          ditto -c -k --keepParent "build/Build/Products/Release/Open AdBlock.app" \
            "build/OpenAdBlock-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAdBlock-unsigned
          path: build/OpenAdBlock-unsigned.zip
          if-no-files-found: error
