name: Build

# Pull requests: unsigned build only. Pushes (or manual runs) on main: build and refresh the `nightly`
# pre-release. Tags vX.Y.Z: build that version and publish release vX.Y.Z.
# Pushes are signed with Developer ID and notarized once the signing secrets exist (README,
# "Signed releases"); without them the release carries an unsigned build. Apple silicon only.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^MARKETING_VERSION = //p' Config/Base.xcconfig)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version, build $GITHUB_RUN_NUMBER"

      - name: Signing mode
        id: mode
        # Signs only with every secret present; otherwise builds unsigned and lists what is missing.
        # Notarization takes an App Store Connect API key (NOTARY_API_KEY, _KEY_ID, _ISSUER_ID) or
        # an Apple ID with an app-specific password (NOTARY_APPLE_ID, NOTARY_PASSWORD).
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 != '' }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD != '' }}
          MACOS_APP_PROFILE: ${{ secrets.MACOS_APP_PROFILE != '' }}
          MACOS_TUNNEL_PROFILE: ${{ secrets.MACOS_TUNNEL_PROFILE != '' }}
          API_KEY: ${{ secrets.NOTARY_API_KEY != '' && secrets.NOTARY_API_KEY_ID != '' && secrets.NOTARY_API_ISSUER_ID != '' }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_PASSWORD != '' }}
        run: |
          missing=()
          for name in MACOS_DEVELOPER_ID_P12 MACOS_DEVELOPER_ID_P12_PASSWORD MACOS_APP_PROFILE \
                      MACOS_TUNNEL_PROFILE; do
            [[ "${!name}" == true ]] || missing+=("$name")
          done
          if [[ "$API_KEY" == true ]]; then notary=api-key
          elif [[ "$APPLE_ID" == true ]]; then notary=apple-id
          else missing+=("NOTARY_APPLE_ID+NOTARY_PASSWORD (or NOTARY_API_KEY+_KEY_ID+_ISSUER_ID)")
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"; echo "Unsigned build (pull request)"
          elif (( ${#missing[@]} )); then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unsigned build; missing secrets: ${missing[*]}"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"; echo "notary=$notary" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing, notarization with $notary"
          fi

      # The core pins its toolchain in rust-toolchain.toml; install it before cargo runs.
      - name: Rust toolchain
        working-directory: open-adblock-core
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: open-adblock-core

      - name: Build the core (COpenAdBlock.xcframework)
        run: scripts/build-core.sh

      - name: Build the app (Release, unsigned)
        if: steps.mode.outputs.signed != 'true'
        run: |
          xcodebuild -version
          xcodebuild -scheme OpenAdBlock -configuration Release -derivedDataPath build \
            ARCHS=arm64 MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO build
          mkdir -p build/export
          ditto "build/Build/Products/Release/Open AdBlock.app" "build/export/Open AdBlock.app"

      - name: Install certificate and profiles
        if: steps.mode.outputs.signed == 'true'
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APP_PROFILE: ${{ secrets.MACOS_APP_PROFILE }}
          TUNNEL_PROFILE: ${{ secrets.MACOS_TUNNEL_PROFILE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          install_profile() {  # base64 profile → installed file; prints its name, exports team id
            local file="$RUNNER_TEMP/profile.provisionprofile" plist="$RUNNER_TEMP/profile.plist"
            echo "$1" | base64 --decode > "$file"
            security cms -D -i "$file" > "$plist"
            local uuid name
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            echo "TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist")" >> "$GITHUB_ENV"
            for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                       "$HOME/Library/MobileDevice/Provisioning Profiles"; do
              mkdir -p "$dir" && cp "$file" "$dir/$uuid.provisionprofile"
            done
            echo "$name"
          }
          echo "APP_PROFILE_NAME=$(install_profile "$APP_PROFILE")" >> "$GITHUB_ENV"
          echo "TUNNEL_PROFILE_NAME=$(install_profile "$TUNNEL_PROFILE")" >> "$GITHUB_ENV"

      - name: Archive and export (Developer ID)
        if: steps.mode.outputs.signed == 'true'
        run: |
          xcodebuild -version
          APP_PROFILE="$APP_PROFILE_NAME" TUNNEL_PROFILE="$TUNNEL_PROFILE_NAME" \
            VERSION="${{ steps.version.outputs.version }}" BUILD="$GITHUB_RUN_NUMBER" \
            scripts/archive.sh

      - name: Notarize
        if: steps.mode.outputs.signed == 'true'
        env:
          NOTARY: ${{ steps.mode.outputs.notary }}
          API_KEY: ${{ secrets.NOTARY_API_KEY }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [[ "$NOTARY" == api-key ]]; then
            KEY="$RUNNER_TEMP/AuthKey.p8"
            echo "$API_KEY" | base64 --decode > "$KEY"
            auth=(--key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID")
          fi
          ditto -c -k --keepParent "build/export/Open AdBlock.app" build/notarize.zip
          xcrun notarytool submit build/notarize.zip "${auth[@]}" --wait --timeout 30m \
            --output-format json | tee build/notary.json
          status="$(plutil -extract status raw -o - build/notary.json)"
          if [[ "$status" != Accepted ]]; then
            xcrun notarytool log "$(plutil -extract id raw -o - build/notary.json)" "${auth[@]}" || true
            exit 1
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "build/export/Open AdBlock.app"
          spctl --assess --type execute --verbose=2 "build/export/Open AdBlock.app"

      - name: Package
        run: |
          suffix=$([[ "${{ steps.mode.outputs.signed }}" == true ]] && echo "" || echo "-unsigned")
          ditto -c -k --keepParent "build/export/Open AdBlock.app" \
            "build/OpenAdBlock-${{ steps.version.outputs.version }}-$GITHUB_RUN_NUMBER$suffix.zip"

      # In-app updates (Sparkle) read appcast.xml from the latest release. Only signed, notarized
      # tag builds are offered: the archive is signed with the EdDSA key whose public half is
      # SUPublicEDKey in Config/App-Info.plist.
      - name: Appcast (Sparkle)
        if: steps.mode.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not set; this release offers no in-app update"
            exit 0
          fi
          zip="$(ls build/OpenAdBlock-*.zip)"
          name="$(basename "$zip")"
          signature="$(echo "$SPARKLE_PRIVATE_KEY" \
            | build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - -p "$zip")"
          length="$(stat -f %z "$zip")"
          minimum="$(sed -n 's/^MACOSX_DEPLOYMENT_TARGET = //p' Config/Base.xcconfig)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name"
          cat > build/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Open AdBlock</title>
              <item>
                <title>Open AdBlock $VERSION</title>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <link>https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME</link>
                <sparkle:version>$GITHUB_RUN_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>$minimum</sparkle:minimumSystemVersion>
                <sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>
                <enclosure url="$url" length="$length" type="application/octet-stream"
                  sparkle:edSignature="$signature"/>
              </item>
            </channel>
          </rss>
          XML
          cat build/appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAdBlock
          path: |
            build/OpenAdBlock-*.zip
            build/appcast.xml
          if-no-files-found: error

      - name: Remove signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true

  release:
    needs: macos
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.macos.outputs.version }}
      SIGNED: ${{ needs.macos.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenAdBlock

      - name: Notes
        run: |
          echo "Version $VERSION (build $GITHUB_RUN_NUMBER), commit $GITHUB_SHA. Apple silicon only." > notes.md
          echo >> notes.md
          if [[ "$SIGNED" == true ]]; then
            echo "Signed with Developer ID and notarized. Move **Open AdBlock** to /Applications," >> notes.md
            echo "open it and approve the system extension when macOS asks." >> notes.md
          else
            echo "**Unsigned build.** macOS only activates the system extension of an app signed" >> notes.md
            echo "with a Developer ID and notarized, so this download only checks the build." >> notes.md
          fi

      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          assets=(OpenAdBlock-*.zip)
          [[ -f appcast.xml ]] && assets+=(appcast.xml)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "Open AdBlock $VERSION" --notes-file notes.md --verify-tag

      - name: Refresh nightly pre-release (main)
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly OpenAdBlock-*.zip --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $VERSION ($GITHUB_RUN_NUMBER)" --notes-file notes.md
